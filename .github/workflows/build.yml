name: Build Windows EXE

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --name afkj-bot main.py

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/afkj-bot | Out-Null
          Copy-Item dist/afkj-bot.exe release/afkj-bot/
          Copy-Item config.ini release/afkj-bot/
          Copy-Item -Recurse templates release/afkj-bot/
          Copy-Item README.md release/afkj-bot/
          Copy-Item run-phantimal.bat release/afkj-bot/
          Copy-Item run-battle.bat release/afkj-bot/
          Copy-Item run-smoke.bat release/afkj-bot/
          Compress-Archive -Path release/afkj-bot/* -DestinationPath release/afkj-bot-win.zip

      - uses: actions/upload-artifact@v4
        with:
          name: afkj-bot-win
          path: release/afkj-bot-win.zip
          if-no-files-found: error
